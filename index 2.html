<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            text-align: center;
        }
        .skin-box {
            border: 2px solid #16213e;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            background: #0f3460;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        #result { font-size: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>🔫 Standoff 2 — Апгрейдер</h2>

    <div class="skin-box">
        <p>Твой скин: <b>AKR-12 | Дракон</b></p>
        <p>Хочешь получить: <b>M4A1 | Вихрь</b></p>
        <p>Шанс успеха: <b>20%</b></p>
    </div>

    <button onclick="upgrade()">🚀 Апгрейд</button>

    <p id="result"></p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function upgrade() {
            const win = Math.random() < 0.2;
            const resultEl = document.getElementById("result");

            if (win) {
                resultEl.innerHTML = "🎉 УСПЕХ! Ты получил M4A1 | Вихрь!";
            } else {
                resultEl.innerHTML = "💀 ПРОВАЛ... Скин сгорел.";
            }

            tg.sendData(JSON.stringify({ result: win ? "win" : "lose" }));
        }
    </script>
</body>
</html>
